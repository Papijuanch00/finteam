<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinTeam — Rastreador de Gastos Compartido</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #12172b;
    --surface2: #1a1f38;
    --border: #2a3050;
    --accent: #00d9ff;
    --accent2: #00ff88;
    --accent3: #ff4477;
    --text: #e8eef5;
    --muted: #6b7a96;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, var(--bg) 0%, #0f1220 100%);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 24px 16px 80px;
  }

  /* LOGIN SCREEN */
  .login-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, var(--bg) 0%, #0f1220 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }

  .login-screen.hidden { display: none; }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    max-width: 380px;
    width: 100%;
    backdrop-filter: blur(10px);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 30px;
  }

  .login-logo .icon { font-size: 48px; margin-bottom: 16px; }

  .login-logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .login-logo .subtitle {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .login-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .login-form .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .login-form label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .login-form input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: all 0.3s;
  }

  .login-form input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(0, 217, 255, 0.15);
  }

  .btn-login {
    width: 100%;
    padding: 14px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: var(--bg);
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 217, 255, 0.2);
  }

  .login-error {
    background: rgba(255, 68, 119, 0.1);
    border: 1px solid var(--accent3);
    border-radius: 8px;
    padding: 10px;
    font-size: 11px;
    color: #ff8899;
    display: none;
  }

  .login-error.show { display: block; }

  /* APP SCREEN */
  .app-screen {
    display: none;
  }

  .app-screen.active { display: block; }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    position: relative;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -24px; left: 50%;
    transform: translateX(-50%);
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(0,217,255,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-left h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }

  .header-left .user-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .header-right {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .user-badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 8px 14px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .user-avatar {
    width: 24px;
    height: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
  }

  .btn-logout {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-logout:hover {
    color: var(--accent3);
    border-color: var(--accent3);
  }

  /* BALANCE CARD */
  .balance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .balance-card::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(0,217,255,0.12) 0%, transparent 70%);
  }

  .balance-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .balance-item .bal-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .balance-item .bal-value {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
  }

  .bal-value.budget { color: var(--accent); }
  .bal-value.spent { color: var(--accent3); }
  .bal-value.remaining { color: var(--accent2); }

  .progress-wrap {
    margin-top: 16px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s;
    border-radius: 3px;
  }

  .progress-fill.danger {
    background: linear-gradient(90deg, var(--accent3), #ff6699);
  }

  /* FORM CARD */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .form-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.full {
    grid-column: 1 / -1;
  }

  .form-group label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: all 0.3s;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(0, 217, 255, 0.15);
  }

  .form-group textarea {
    resize: none;
    height: 60px;
  }

  .btn-add {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: var(--bg);
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }

  .btn-add:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 217, 255, 0.25);
  }

  .btn-add.edit {
    background: linear-gradient(90deg, #ff9500, #ffb800);
  }

  /* CHART CARD */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    display: none;
  }

  .chart-card.show {
    display: block;
  }

  .chart-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .chart-container {
    position: relative;
    height: 300px;
    margin-bottom: 20px;
  }

  /* CATEGORÍAS */
  .cats-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    display: none;
  }

  .cats-card.show {
    display: block;
  }

  .cats-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--accent);
  }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .cat-row:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .cat-icon {
    font-size: 20px;
    min-width: 24px;
  }

  .cat-info {
    flex: 1;
  }

  .cat-name {
    font-size: 12px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .cat-bar-wrap {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .cat-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }

  .cat-amount {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
  }

  /* LIST CARD */
  .list-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .list-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
  }

  .btn-clear {
    background: transparent;
    border: 1px solid var(--accent3);
    color: var(--accent3);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-clear:hover {
    background: rgba(255, 68, 119, 0.1);
  }

  .expense-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    transition: background 0.2s;
  }

  .expense-item:last-child {
    border-bottom: none;
  }

  .expense-item:hover {
    background: rgba(0, 217, 255, 0.05);
    border-radius: 8px;
    padding: 12px 8px;
    cursor: pointer;
  }

  .exp-icon {
    font-size: 20px;
    min-width: 24px;
  }

  .exp-info {
    flex: 1;
  }

  .exp-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .exp-name {
    font-size: 12px;
    color: var(--text);
  }

  .exp-amount {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent3);
  }

  .exp-meta {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .exp-cat {
    color: var(--accent);
  }

  .exp-comment {
    color: var(--muted);
  }

  .exp-date {
    color: var(--muted);
  }

  .btn-actions {
    display: flex;
    gap: 6px;
  }

  .btn-del, .btn-edit {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
    padding: 4px 6px;
  }

  .btn-del:hover {
    color: var(--accent3);
  }

  .btn-edit:hover {
    color: var(--accent);
  }

  .expense-item.editing {
    background: rgba(0, 217, 255, 0.15);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .empty-state div:last-child {
    font-size: 13px;
    line-height: 1.6;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(10px);
  }

  .toast.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* MODAL */
  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }

  .modal.show {
    display: flex;
  }

  .modal-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    backdrop-filter: blur(10px);
  }

  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .modal-buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .btn-cancel, .btn-save {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
  }

  .btn-cancel {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-cancel:hover {
    border-color: var(--accent3);
    color: var(--accent3);
  }

  .btn-save {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: var(--bg);
  }

  .btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 217, 255, 0.25);
  }

  /* FILTROS */
  .filter-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0, 217, 255, 0.1);
  }

  @media (max-width: 640px) {
    .balance-row {
      grid-template-columns: 1fr;
    }

    .header {
      flex-direction: column;
      gap: 16px;
      align-items: flex-start;
    }

    .header-right {
      width: 100%;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon">💰</div>
      <h1>FinTeam</h1>
      <div class="subtitle">Gestor de gastos</div>
    </div>
    <div class="login-form">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="loginName" placeholder="Tu nombre" maxlength="20">
      </div>
      <div class="form-group">
        <label>Presupuesto (€)</label>
        <input type="number" id="loginBudget" placeholder="300-2000" min="300" max="2000" value="540">
      </div>
      <button class="btn-login" onclick="login()">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>
</div>

<div class="app-screen" id="appScreen">
  <div class="header">
    <div class="header-left">
      <h1>💰 FinTeam</h1>
      <div class="user-label">Sesión: <span id="userName">Usuario</span></div>
    </div>
    <div class="header-right">
      <div class="user-badge">
        <div class="user-avatar" id="userAvatar">U</div>
        <span id="userBudgetDisplay">540€</span>
      </div>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </div>

  <!-- BALANCE -->
  <div class="balance-card">
    <div class="balance-row">
      <div class="balance-item">
        <div class="bal-label">Presupuesto</div>
        <div class="bal-value budget" id="totalBudget">540€</div>
      </div>
      <div class="balance-item">
        <div class="bal-label">Gastado</div>
        <div class="bal-value spent" id="totalSpent">0€</div>
      </div>
      <div class="balance-item">
        <div class="bal-label">Disponible</div>
        <div class="bal-value remaining" id="totalRemaining">540€</div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Presupuesto usado</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-card">
    <div class="form-title" id="formTitle">+ Nuevo gasto</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Concepto</label>
        <input type="text" id="inputName" placeholder="ej. Café" maxlength="30">
      </div>
      <div class="form-group">
        <label>Importe (€)</label>
        <input type="number" id="inputAmount" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="inputCat">
          <option value="🛒 Mercado">🛒 Mercado</option>
          <option value="🍔 Comida fuera">🍔 Comida fuera</option>
          <option value="🚇 Transporte">🚇 Transporte</option>
          <option value="💊 Salud">💊 Salud</option>
          <option value="💪 Gym / Deporte">💪 Gym / Deporte</option>
          <option value="🎬 Ocio">🎬 Ocio</option>
          <option value="👗 Ropa">👗 Ropa</option>
          <option value="📱 Tecnología">📱 Tecnología</option>
          <option value="🏠 Hogar">🏠 Hogar</option>
          <option value="💳 Deuda / Préstamo">💳 Deuda / Préstamo</option>
          <option value="🎁 Regalo">🎁 Regalo</option>
          <option value="✈️ Viaje">✈️ Viaje</option>
          <option value="📦 Otro">📦 Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="inputDate">
      </div>
      <div class="form-group full">
        <label>Comentario (opcional)</label>
        <textarea id="inputComment" placeholder="¿De qué era este gasto?"></textarea>
      </div>
    </div>
    <button class="btn-add" id="btnSubmit" onclick="addExpense()">Añadir gasto</button>
    <button class="btn-add" id="btnCancel" onclick="cancelEdit()" style="display:none; background: var(--surface2); border: 1px solid var(--accent3); color: var(--accent3); margin-top: 8px;">Cancelar edición</button>
  </div>

  <!-- GRÁFICO -->
  <div class="chart-card" id="chartCard">
    <div class="chart-title">📊 Gastos por categoría</div>
    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>
  </div>

  <!-- CATEGORÍAS -->
  <div class="cats-card" id="catsCard">
    <div class="cats-title">📈 Resumen por categoría</div>
    <div id="catsList"></div>
  </div>

  <!-- FILTROS -->
  <div class="filter-bar" id="filterBar" style="display:none">
    <button class="filter-btn active" onclick="filterExpenses('all')">Todos</button>
    <button class="filter-btn" onclick="filterExpenses('7days')">Últimos 7 días</button>
    <button class="filter-btn" onclick="filterExpenses('30days')">Este mes</button>
  </div>

  <!-- LISTA -->
  <div class="list-card">
    <div class="list-header">
      <div class="list-title">📋 Registro</div>
      <button class="btn-clear" onclick="clearAll()">Borrar todo</button>
    </div>
    <div id="expensesList">
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <div>Aún no hay gastos registrados.<br>¡Añade tu primer gasto!</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modalTitle">Editar gasto</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Concepto</label>
        <input type="text" id="modalName" maxlength="30">
      </div>
      <div class="form-group">
        <label>Importe (€)</label>
        <input type="number" id="modalAmount" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="modalCat">
          <option value="🛒 Mercado">🛒 Mercado</option>
          <option value="🍔 Comida fuera">🍔 Comida fuera</option>
          <option value="🚇 Transporte">🚇 Transporte</option>
          <option value="💊 Salud">💊 Salud</option>
          <option value="💪 Gym / Deporte">💪 Gym / Deporte</option>
          <option value="🎬 Ocio">🎬 Ocio</option>
          <option value="👗 Ropa">👗 Ropa</option>
          <option value="📱 Tecnología">📱 Tecnología</option>
          <option value="🏠 Hogar">🏠 Hogar</option>
          <option value="💳 Deuda / Préstamo">💳 Deuda / Préstamo</option>
          <option value="🎁 Regalo">🎁 Regalo</option>
          <option value="✈️ Viaje">✈️ Viaje</option>
          <option value="📦 Otro">📦 Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label>Fecha</label>
        <input type="date" id="modalDate">
      </div>
      <div class="form-group full">
        <label>Comentario (opcional)</label>
        <textarea id="modalComment"></textarea>
      </div>
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveEdit()">Guardar</button>
    </div>
  </div>
</div>

<script>
  const CAT_COLORS = [
    '#00d9ff','#00ff88','#ff4477','#ff88ff','#ffaa00',
    '#88ff00','#ff00ff','#ff7700','#00ff77','#ff0088'
  ];

  let currentUser = null;
  let allUsers = JSON.parse(localStorage.getItem('finteam_users') || '{}');
  let currentUserExpenses = [];
  let filteredExpenses = [];
  let chart = null;
  let editingId = null;
  let currentFilter = 'all';
  let selectedCategory = null;

  document.getElementById('inputDate').valueAsDate = new Date();

  function getCatIcon(cat) {
    return cat.split(' ')[0];
  }

  function login() {
    const name = document.getElementById('loginName').value.trim();
    const budget = parseFloat(document.getElementById('loginBudget').value);
    const error = document.getElementById('loginError');

    if (!name || name.length < 2) {
      error.textContent = '❌ Pon un nombre válido';
      error.classList.add('show');
      return;
    }

    if (isNaN(budget) || budget < 300 || budget > 2000) {
      error.textContent = '❌ Presupuesto entre 300€ y 2000€';
      error.classList.add('show');
      return;
    }

    error.classList.remove('show');

    if (!allUsers[name]) {
      allUsers[name] = { budget, expenses: [] };
    }

    currentUser = {
      name,
      budget: allUsers[name].budget,
      expenses: allUsers[name].expenses || []
    };

    currentUserExpenses = currentUser.expenses;
    filteredExpenses = currentUserExpenses;

    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.add('active');

    document.getElementById('userName').textContent = name;
    document.getElementById('userBudgetDisplay').textContent = budget + '€';
    document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
    document.getElementById('totalBudget').textContent = budget + '€';

    render();
  }

  function logout() {
    allUsers[currentUser.name].expenses = currentUserExpenses;
    localStorage.setItem('finteam_users', JSON.stringify(allUsers));

    currentUser = null;
    currentUserExpenses = [];
    selectedCategory = null;

    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.remove('active');
    document.getElementById('loginError').classList.remove('show');
    document.getElementById('loginName').value = '';
    document.getElementById('loginBudget').value = '540';
    
    if (chart) {
      chart.destroy();
      chart = null;
    }
  }

  function addExpense() {
    const name = document.getElementById('inputName').value.trim();
    const amount = parseFloat(document.getElementById('inputAmount').value);
    const cat = document.getElementById('inputCat').value;
    const date = document.getElementById('inputDate').value;
    const comment = document.getElementById('inputComment').value.trim();

    if (!name || isNaN(amount) || amount <= 0) {
      showToast('⚠️ Pon un concepto e importe válido');
      return;
    }

    if (editingId !== null) {
      const index = currentUserExpenses.findIndex(e => e.id === editingId);
      if (index !== -1) {
        currentUserExpenses[index] = { id: editingId, name, amount, cat, date, comment };
        showToast('✏️ Gasto actualizado correctamente');
        editingId = null;
      }
    } else {
      const expense = {
        id: Date.now(),
        name, amount, cat, date, comment
      };
      currentUserExpenses.unshift(expense);
      showToast('✅ Gasto añadido correctamente');
    }

    save();
    render();
    clearForm();
  }

  function deleteExpense(id) {
    if (confirm('¿Eliminar este gasto?')) {
      currentUserExpenses = currentUserExpenses.filter(e => e.id !== id);
      save();
      render();
      showToast('🗑️ Gasto eliminado');
    }
  }

  function editExpense(id) {
    const expense = currentUserExpenses.find(e => e.id === id);
    if (!expense) return;

    editingId = id;
    document.getElementById('inputName').value = expense.name;
    document.getElementById('inputAmount').value = expense.amount;
    document.getElementById('inputCat').value = expense.cat;
    document.getElementById('inputDate').value = expense.date;
    document.getElementById('inputComment').value = expense.comment;
    document.getElementById('formTitle').textContent = '✏️ Editar gasto';
    document.getElementById('btnSubmit').textContent = 'Guardar cambios';
    document.getElementById('btnSubmit').classList.add('edit');
    document.getElementById('btnCancel').style.display = 'block';

    // Marcar el elemento en la lista como editando
    document.querySelectorAll('.expense-item').forEach(item => item.classList.remove('editing'));
    const items = document.querySelectorAll('.expense-item');
    items.forEach(item => {
      if (item.getAttribute('data-id') === String(id)) {
        item.classList.add('editing');
      }
    });

    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('inputName').focus();
    showToast('✏️ Editando gasto - Realiza cambios y guarda');
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('formTitle').textContent = '+ Nuevo gasto';
    document.getElementById('btnSubmit').textContent = 'Añadir gasto';
    document.getElementById('btnSubmit').classList.remove('edit');
    document.getElementById('btnCancel').style.display = 'none';
    document.querySelectorAll('.expense-item').forEach(item => item.classList.remove('editing'));
    clearForm();
    showToast('❌ Edición cancelada');
  }

  function clearAll() {
    if (currentUserExpenses.length === 0) return;
    if (confirm('¿Borrar todos tus gastos?')) {
      currentUserExpenses = [];
      filteredExpenses = [];
      save();
      render();
      showToast('🗑️ Todos los gastos eliminados');
    }
  }

  function clearForm() {
    document.getElementById('inputName').value = '';
    document.getElementById('inputAmount').value = '';
    document.getElementById('inputComment').value = '';
    document.getElementById('inputDate').valueAsDate = new Date();
    editingId = null;
    document.getElementById('formTitle').textContent = '+ Nuevo gasto';
    document.getElementById('btnSubmit').textContent = 'Añadir gasto';
    document.getElementById('btnSubmit').classList.remove('edit');
  }

  function save() {
    allUsers[currentUser.name].expenses = currentUserExpenses;
    localStorage.setItem('finteam_users', JSON.stringify(allUsers));
  }

  function filterByCategory(categoryName) {
    selectedCategory = categoryName;
    const categoryExpenses = currentUserExpenses.filter(e => e.cat === categoryName);
    filteredExpenses = categoryExpenses;
    
    renderList();
    updateChart();
    
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    showToast(`📊 Mostrando gastos de: ${categoryName}`);
  }

  function clearCategoryFilter() {
    selectedCategory = null;
    filteredExpenses = currentUserExpenses;
    renderList();
    updateChart();
    showToast('🔄 Filtro de categoría eliminado');
  }

  function filterExpenses(filter) {
    currentFilter = filter;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    if (filter === 'all') {
      filteredExpenses = [...currentUserExpenses];
    } else if (filter === '7days') {
      const sevenDaysAgo = new Date(today);
      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
      filteredExpenses = currentUserExpenses.filter(e => new Date(e.date) >= sevenDaysAgo);
    } else if (filter === '30days') {
      const thirtyDaysAgo = new Date(today);
      thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
      filteredExpenses = currentUserExpenses.filter(e => new Date(e.date) >= thirtyDaysAgo);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    renderList();
    updateChart();
  }

  function render() {
    const total = currentUserExpenses.reduce((s, e) => s + e.amount, 0);
    const budget = currentUser.budget;
    const remaining = budget - total;
    const pct = Math.min((total / budget) * 100, 100);

    document.getElementById('totalSpent').textContent = total.toFixed(2) + '€';
    document.getElementById('totalRemaining').textContent = remaining.toFixed(2) + '€';
    document.getElementById('progressPct').textContent = pct.toFixed(0) + '%';

    const fill = document.getElementById('progressFill');
    fill.style.width = pct + '%';
    fill.className = 'progress-fill' + (pct >= 90 ? ' danger' : '');

    // Mostrar filtros y gráfico
    if (currentUserExpenses.length > 0) {
      document.getElementById('filterBar').style.display = 'flex';
      document.getElementById('chartCard').classList.add('show');
    } else {
      document.getElementById('filterBar').style.display = 'none';
      document.getElementById('chartCard').classList.remove('show');
    }

    // Categorías
    const catMap = {};
    currentUserExpenses.forEach(e => {
      catMap[e.cat] = (catMap[e.cat] || 0) + e.amount;
    });
    const catEntries = Object.entries(catMap).sort((a,b) => b[1]-a[1]);

    const catsCard = document.getElementById('catsCard');
    if (catEntries.length > 0) {
      catsCard.classList.add('show');
      const maxCat = catEntries[0][1];
      document.getElementById('catsList').innerHTML = catEntries.map(([cat, amt], i) => `
        <div class="cat-row">
          <div class="cat-icon">${getCatIcon(cat)}</div>
          <div class="cat-info">
            <div class="cat-name">${cat.substring(2)}</div>
            <div class="cat-bar-wrap">
              <div class="cat-bar" style="width:${(amt/maxCat)*100}%;background:${CAT_COLORS[i % CAT_COLORS.length]}"></div>
            </div>
          </div>
          <div class="cat-amount">${amt.toFixed(2)}€</div>
        </div>
      `).join('');
    } else {
      catsCard.classList.remove('show');
    }

    filteredExpenses = currentUserExpenses;
    renderList();
    updateChart();
  }

  function renderList() {
    const list = document.getElementById('expensesList');
    
    // Mostrar indicador de filtro activo
    const listHeader = document.querySelector('.list-header');
    if (selectedCategory) {
      let filterIndicator = document.getElementById('filterIndicator');
      if (!filterIndicator) {
        filterIndicator = document.createElement('div');
        filterIndicator.id = 'filterIndicator';
        filterIndicator.style.cssText = 'background: rgba(0, 217, 255, 0.1); border: 1px solid #00d9ff; border-radius: 8px; padding: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;';
        list.parentElement.insertBefore(filterIndicator, list);
      }
      filterIndicator.innerHTML = `
        <div style="color: #00d9ff; font-size: 12px;">
          <strong>Filtrado por:</strong> ${selectedCategory.substring(2)}
        </div>
        <button onclick="clearCategoryFilter()" style="background: transparent; border: 1px solid #00d9ff; color: #00d9ff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px;">Limpiar filtro</button>
      `;
      filterIndicator.style.display = 'block';
    } else {
      const filterIndicator = document.getElementById('filterIndicator');
      if (filterIndicator) filterIndicator.style.display = 'none';
    }
    
    if (filteredExpenses.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div>No hay gastos registrados.<br>¡Añade tu primer gasto!</div></div>`;
    } else {
      list.innerHTML = filteredExpenses.map(e => `
        <div class="expense-item" data-id="${e.id}" onclick="editExpense(${e.id})">
          <div class="exp-icon">${getCatIcon(e.cat)}</div>
          <div class="exp-info">
            <div class="exp-top">
              <div class="exp-name">${e.name}</div>
              <div class="exp-amount">-${e.amount.toFixed(2)}€</div>
            </div>
            <div class="exp-meta">
              <span class="exp-cat">${e.cat.substring(2)}</span>
              ${e.comment ? `<span class="exp-comment">· ${e.comment}</span>` : ''}
              <span class="exp-date">${formatDate(e.date)}</span>
            </div>
          </div>
          <div class="btn-actions" onclick="event.stopPropagation()">
            <button class="btn-del" onclick="deleteExpense(${e.id})">✕</button>
          </div>
        </div>
      `).join('');
    }
  }

  function updateChart() {
    const catMap = {};
    const catFullNames = {};
    filteredExpenses.forEach(e => {
      catMap[e.cat] = (catMap[e.cat] || 0) + e.amount;
      catFullNames[e.cat.substring(2)] = e.cat;
    });

    const labels = Object.keys(catMap).map(cat => cat.substring(2));
    const data = Object.values(catMap);

    const ctx = document.getElementById('expenseChart');
    
    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.options.onClick = function(event, elements) {
        if (elements.length > 0) {
          const index = elements[0].index;
          const categoryName = catFullNames[labels[index]];
          filterByCategory(categoryName);
        }
      };
      chart.update();
    } else {
      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: CAT_COLORS,
            borderColor: '#12172b',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          onClick: function(event, elements) {
            if (elements.length > 0) {
              const index = elements[0].index;
              const categoryName = catFullNames[labels[index]];
              filterByCategory(categoryName);
            }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#e8eef5',
                font: { size: 12 },
                padding: 15,
                cursor: 'pointer'
              }
            },
            tooltip: {
              callbacks: {
                afterLabel: function() {
                  return 'Click para filtrar';
                }
              }
            }
          }
        }
      });
    }
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const [y,m,d] = dateStr.split('-');
    return `${d}/${m}`;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
